# Build e deploy su GitHub Pages a ogni push su main (Step 17).
# URL, chiave publishable ed email dell'account arrivano dalle variabili del
# repository (Settings → Secrets and variables → Actions → Variables): finiscono
# comunque nel bundle pubblico, quindi non sono segreti. I dati li proteggono le
# policy del database e le registrazioni spente sul progetto Supabase.

name: Pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; quello in corso non si interrompe a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_EMAIL: ${{ vars.VITE_SUPABASE_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Senza le variabili la build riesce lo stesso, ma l'app si rompe all'apertura.
      - name: Controlla le variabili di Supabase
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_SUPABASE_EMAIL; do
            [ -n "${!v}" ] || { echo "::error::Manca la variabile $v"; exit 1; }
          done
      # I test contro il Supabase locale qui si saltano: vogliono Docker.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
